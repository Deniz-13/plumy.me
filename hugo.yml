baseURL: "https://plumy.me"
title: plumy devlog
pagination:
  pagerSize: 5
theme: PaperMod
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: plumy's devlog
  description: "siber güvenlik, araçlar ve açık kaynak üzerine notlar"
  keywords: [Blog, Siber Güvenlik, CTF, Portfolio]
  author: plumy
  DateFormat: "2006-01-02"
  defaultTheme: dark
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  label:
    text: "/home/plumy"

  homeInfoParams:
    Title: "Hi, I'm Deniz."
    Content: |
      Welcome to my devlog. I document whatever I learn or build. Mainly focusing on (but not limited to) cybersecurity related topics.

      I learn by building programs and solving problems to gather hands-on experience. You'll find my CTF writeups, notes on technologies and techniques I learn along the way, project demos and free(as in freedom) and open source software.

  socialIcons:
    - name: github
      url: "https://github.com/Deniz-13"
    - name: linkedin
      url: "https://linkedin.com/in/deniz-ince-"

  cover:
    hidden: true
    hiddenInList: true
    hiddenInSingle: true

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: tags
      name: categories
      url: /tags/
      weight: 10
    - identifier: about
      name: about me
      url: /about/
      weight: 20

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
