{{- $headers := findRE "<h[1-6].*?>(.|\n])+?</h[1-6]>" .Content -}}
{{- if ge (len $headers) 1 -}}
<div class="toc toc-rail">
  <details {{ if (.Param "TocOpen") }}open{{ end }}>
    <summary accesskey="c" title="(Alt + C)">
      <span class="toc-title">{{- i18n "toc" | default "Table of Contents" -}}</span>
    </summary>

    <div class="inner">
      {{- .TableOfContents -}}
    </div>
  </details>
</div>
{{- end -}}
